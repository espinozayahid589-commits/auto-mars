<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Autos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--s:#fff;--t:#16212e;--m:#64748b;--l:#e2e8f0;--navy:#0f2a3d;--y:#f2a900;--yt:#1a1300;--r:#c0362c;--g:#1f8a4c;--sh:0 1px 2px rgba(15,42,61,.06),0 8px 24px rgba(15,42,61,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1117;--s:#141d27;--t:#e8edf3;--m:#8b9bb0;--l:#233041;--navy:#091620;--r:#ff8a80;--g:#5fd08c;--sh:0 1px 2px #0006,0 8px 24px #0004}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 "IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;letter-spacing:.2px;margin:0}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.5rem}h3{font-size:1.2rem;margin:26px 0 10px}
.ic{width:18px;height:18px;flex:none}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd9e4;display:flex;flex-direction:column;gap:4px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;font:600 1.4rem "Barlow Condensed",sans-serif}
.mark{width:36px;height:36px;border-radius:10px;background:var(--y);color:var(--yt);display:grid;place-items:center;flex:none;overflow:hidden}
.mark .ic{width:22px;height:22px}
.mark img{width:100%;height:100%;object-fit:cover}
aside button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:inherit;border:0;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;border-left:3px solid transparent}
aside button:hover{background:#ffffff14}
aside button.on{background:#ffffff1c;color:#fff;border-left-color:var(--y)}
.sp{flex:1;min-height:10px}
.who{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid #ffffff22;margin-top:6px}
.av{width:34px;height:34px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-weight:600;color:#fff}
.who small{display:block;color:#8fa3b5}
main{padding:28px 32px 70px;max-width:1120px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.head p{margin:2px 0 0;color:var(--m)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,button.btn{display:inline-flex;align-items:center;gap:8px;background:var(--y);color:var(--yt);border:0;border-radius:8px;padding:9px 16px;font:600 .95rem "IBM Plex Sans",sans-serif;cursor:pointer;box-shadow:0 1px 0 #0002}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--s);color:var(--t);border:1px solid var(--l);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.red{background:transparent;color:var(--r);border:1px solid var(--l);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin-top:4px}
input:focus,select:focus{border-color:var(--y)}
label{display:block;margin-bottom:12px;font-size:.88rem;color:var(--m);font-weight:500}
.search{position:relative;flex:1;min-width:200px}
.search input{margin:0;padding-left:38px;background:var(--s)}
.search .ic{position:absolute;left:12px;top:12px;color:var(--m)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card,dialog{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:20px;color:var(--t);box-shadow:var(--sh)}
dialog{width:min(440px,92vw);padding:24px}
dialog h3{margin:0 0 14px;font-size:1.5rem}
dialog::backdrop{background:#0a121bb3;backdrop-filter:blur(2px)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tw{overflow-x:auto;background:var(--s);border:1px solid var(--l);border-radius:14px;box-shadow:var(--sh);margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--l)}
th{font-size:.82rem;font-weight:500;color:var(--m);background:color-mix(in srgb,var(--l) 35%,transparent)}
tr:hover>td{background:color-mix(in srgb,var(--y) 6%,transparent)}
tr:last-child td{border-bottom:0}
.folio{font:600 1.1rem "Barlow Condensed",sans-serif}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.m{color:var(--m)}
.neg{color:var(--r);font-weight:600}.ok{color:var(--g);font-weight:600}
s{color:var(--m)}
.bd{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.e0{--c:#64748b}.e1{--c:#2f7fd1}.e2{--c:#c27b00}.e3{--c:#7a4fd0}.e4{--c:#1f8a4c}.e5{--c:#4b5b6e}.e6{--c:#c0362c}
.pend{color:#c27b00;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:8px}
.stat{display:flex;gap:14px;align-items:center}
.stat i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--y) 22%,transparent);color:var(--y);font-style:normal;flex:none}
.stat i .ic{width:22px;height:22px}
.stat span{color:var(--m);font-size:.88rem}
.stat b{display:block;font:600 1.9rem/1.1 "Barlow Condensed",sans-serif}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px}
.info small{display:block;color:var(--m);font-size:.82rem}
.info div{min-width:0}
.big{font:600 2.4rem/1 "Barlow Condensed",sans-serif}
.sum p{display:flex;justify-content:space-between;margin:6px 0}
.pg{height:8px;border-radius:99px;background:var(--l);overflow:hidden;margin:14px 0 4px}
.pg div{height:100%;background:var(--g)}
.hb{height:10px;border-radius:99px;background:var(--y);min-width:3px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:14px;margin-top:16px}
.st{flex:1;min-width:118px;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;color:var(--m);font:500 .85rem "IBM Plex Sans",sans-serif;cursor:pointer;text-align:center;padding:4px}
.st i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;border:2px solid var(--l);background:var(--s)}
.st .ic{width:16px;height:16px}
.st.done i{background:var(--g);border-color:var(--g);color:#fff}
.st.cur i{background:var(--y);border-color:var(--y);color:var(--yt)}
.st.cur{color:var(--t);font-weight:600}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:10px}
.ph button{padding:0;border:1px solid var(--l);background:var(--s);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:var(--t);font:inherit}
.ph img{width:100%;height:110px;object-fit:cover;display:block}
.ph span{display:block;padding:7px 9px;font-size:.82rem}
.empty{text-align:center;padding:44px 16px;color:var(--m)}
.empty .ic{width:38px;height:38px;color:var(--y);margin-bottom:8px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:radial-gradient(900px 500px at 10% 0,#1d4a6b 0,var(--navy) 60%);color:#dbe6f0;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.hero h1{color:#fff;font-size:3.4rem}
.hero p{font-size:1.1rem;max-width:34ch;margin:0}
.hero ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.hero li{display:flex;gap:10px;align-items:center}
.hero li .ic{color:var(--y)}
.formside{display:grid;place-items:center;padding:24px}
.formside .card{width:min(380px,100%)}
.formside h2{margin-bottom:14px;font-size:1.9rem}
.hint{font-size:.82rem;color:var(--m);margin:14px 0 0}
#tk{display:none}
@media(max-width:860px){
 .shell{display:block}
 aside{flex-direction:row;height:auto;overflow-x:auto;padding:8px;align-items:center;gap:4px;z-index:5}
 aside .brand span,.sp,.who small,.who .av{display:none}
 .brand{padding:0 8px}.who{border:0;margin:0;padding:0}
 aside button{width:auto;white-space:nowrap;padding:8px 12px}
 main{padding:20px 14px 60px}
 .grid2{grid-template-columns:1fr}
 .auth{grid-template-columns:1fr}.hero{padding:36px 24px}.hero h1{font-size:2.6rem}
}
@media print{body>*:not(#tk){display:none!important}#tk{display:block;color:#000;background:#fff;padding:12px;font:13px/1.5 "IBM Plex Sans",Arial,sans-serif}#tk table{min-width:0;width:100%;border-collapse:collapse}#tk th,#tk td{padding:4px 6px;border-bottom:1px solid #bbb;text-align:left}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="tk"></div>
<script>
let db;try{db=JSON.parse(localStorage.getItem('taller'))}catch(e){}
db=db||{users:[{user:'admin',pw:'admin123',rol:'admin'},{user:'cajero',pw:'caja123',rol:'cajero'},{user:'mecanico',pw:'meca123',rol:'mecanico'}],clients:[],vehicles:[],orders:[],audit:[],seq:0};
function norm(){db.cfg=db.cfg||{n:'Taller de Autos',a:'',t:'',l:'',f:'Gracias por su preferencia'};db.orders.forEach(o=>{o.disc=o.disc||0;o.fotos=o.fotos||[]});document.title=db.cfg.n}
norm();
let me=null,view='panel',openId=null,openV=null,q='';
const rep={k:'hoy',d:''};
const save=()=>{try{localStorage.setItem('taller',JSON.stringify(db));return true}catch(e){alert('No hay espacio en este navegador. Descarga un respaldo y reduce el número de fotos.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=n=>'$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>new Date(s).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
const today=()=>new Date().toLocaleDateString('en-CA');
const day=s=>new Date(s).toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const log=(a,d)=>{db.audit.push({t:new Date().toISOString(),u:me.user,a,d});save()};
const ES=['Recibido','Diagnóstico','Pendiente de autorización','Reparación','Terminado','Entregado'];
const P={admin:'cotpa',cajero:'cotp',mecanico:'t'};
const can=p=>me&&P[me.rol].includes(p);
const C=id=>db.clients.find(x=>x.id==id)||{};
const Vh=id=>db.vehicles.find(x=>x.id==id)||{};
const O=()=>db.orders.find(x=>x.id==openId);
const live=o=>o.estado!='Cancelada';
const sum=a=>a.filter(i=>i.aut).reduce((s,i)=>s+i.q*i.p,0);
const sub=o=>sum(o.jobs)+sum(o.parts);
const tot=o=>live(o)?Math.max(Math.round((sub(o)-o.disc)*100)/100,0):0;
const pd=o=>o.pays.filter(p=>!p.void).reduce((s,p)=>s+p.m,0);
const sal=o=>live(o)?Math.round((tot(o)-pd(o))*100)/100:0;
const go=v=>{view=v;openId=null;openV=null;q='';render()};
const IC={
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 panel:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 orders:'<path d="M9 4h6v3H9z"/><path d="M7 5.5H5v15h14v-15h-2"/><path d="M9 12h6M9 16h6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.7a3.5 3.5 0 010 6.6M18 14.2c2 .8 3.5 2.7 3.5 5.8"/>',
 car:'<path d="M3 17v-5l2-5h14l2 5v5"/><path d="M3 17h18M3 12h18"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/>',
 log:'<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/>',
 out:'<path d="M10 4H5v16h5"/><path d="M15 8l4 4-4 4M19 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 print:'<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M7 14h10v6H7z"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
 cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 wallet:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H4z"/><path d="M4 7V6a2 2 0 012-2h10"/><circle cx="16" cy="13.5" r="1.2"/>',
 flag:'<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>',
 chart:'<path d="M4 20V4M4 20h16"/><rect x="8" y="11" width="3" height="6"/><rect x="13" y="7" width="3" height="10"/>',
 shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
 key:'<circle cx="8" cy="14" r="3.5"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 percent:'<path d="M18 6L6 18"/><circle cx="7.5" cy="7.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const bd=e=>`<span class="bd e${e=='Cancelada'?6:ES.indexOf(e)}">${e}</span>`;
const mark=()=>`<div class="mark">${db.cfg.l?`<img src="${db.cfg.l}" alt="">`:ic('gear')}</div>`;
const empty=(t,ico,btn)=>`<div class="card empty">${ic(ico)}<p>${t}</p>${btn||''}</div>`;
const has=s=>s.toLowerCase().includes(q.toLowerCase());
const head=(t,sub,acts)=>`<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="acts">${acts||''}</div></div>`;
const addBtn=(fn,t)=>`<button class="btn" onclick="${fn}">${ic('plus')}${t}</button>`;
const sbox=(fn,ph)=>`<div class="search">${ic('search')}<input placeholder="${ph}" oninput="q=this.value;lst.innerHTML=${fn}()"></div>`;
const stat=(i,t,v)=>`<div class="card stat"><i>${ic(i)}</i><div><span>${t}</span><b>${v}</b></div></div>`;

function img(file,max,type,qu){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(type,qu))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}

function form(title,fields,cb){
  dlg.style.width='';
  dlg.innerHTML=`<form><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.n}">${f.o.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" ${f.t=='number'?'step="any" min="0"':''} ${f.t=='file'?'accept="image/*"':''} ${f.r===false?'':'required'} value="${esc(f.v)}">`}</label>`).join('')}<div class="row"><button class="btn">Guardar</button><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button></div></form>`;
  dlg.querySelector('form').onsubmit=e=>{e.preventDefault();if(cb(Object.fromEntries(new FormData(e.target)))!==false)dlg.close()};
  dlg.showModal();
}

function login(e){
  e.preventDefault();const f=new FormData(e.target);
  const u=db.users.find(x=>x.user==f.get('u')&&x.pw==f.get('p'));
  if(!u)return alert('Usuario o contraseña incorrectos.');
  if(u.on===false)return alert('Este usuario está desactivado.');
  me=u;view='panel';log('Inicio de sesión','');render();
}

function render(){
  const app=document.getElementById('app');
  if(!me){
    app.innerHTML=`<div class="auth"><section class="hero">${mark()}<h1>${esc(db.cfg.n)}</h1><p>Órdenes, cobros y saldos de tu taller en un solo lugar.</p><ul><li>${ic('check')}Cada orden con su folio, trabajos y piezas</li><li>${ic('check')}Abonos y saldo pendiente siempre al día</li><li>${ic('check')}Comprobantes listos para imprimir o enviar por WhatsApp</li></ul></section><section class="formside"><form class="card" onsubmit="login(event)"><h2>Iniciar sesión</h2><label>Usuario<input name="u" required autofocus></label><label>Contraseña<input name="p" type="password" required></label><button class="btn" style="width:100%;justify-content:center">Entrar</button><p class="hint">Prueba: <b>admin</b> / admin123 · <b>cajero</b> / caja123 · <b>mecanico</b> / meca123</p></form></section></div>`;
    return;
  }
  const tabs=[['panel','Panel','panel'],['ordenes','Órdenes','orders']];
  if(can('c'))tabs.push(['clientes','Clientes','users'],['vehiculos','Vehículos','car']);
  if(can('p'))tabs.push(['reportes','Reportes','chart']);
  if(can('a'))tabs.push(['bitacora','Bitácora','log'],['usuarios','Usuarios','shield'],['config','Configuración','gear']);
  app.innerHTML=`<div class="shell"><aside><div class="brand">${mark()}<span>${esc(db.cfg.n)}</span></div>${tabs.map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')">${ic(t[2])}${t[1]}</button>`).join('')}<div class="sp"></div>${can('a')?`<button onclick="bk()">${ic('down')}Respaldar</button><button onclick="rf.click()">${ic('up')}Restaurar</button><input id="rf" type="file" accept=".json" hidden onchange="rs(event)">`:''}<button onclick="cpw(me.user)">${ic('key')}Mi contraseña</button><div class="who"><div class="av">${esc(me.user[0].toUpperCase())}</div><div>${esc(me.user)}<small>${me.rol}</small></div></div><button onclick="me=null;openId=null;openV=null;render()">${ic('out')}Salir</button></aside><main>${openV?hist():openId?detalle():V[view]()}</main></div>`;
}

const V={
  panel(){
    const rec=[...db.orders].reverse().slice(0,5);
    const hoy=db.orders.reduce((s,o)=>s+o.pays.filter(p=>!p.void&&day(p.f)==today()).reduce((a,p)=>a+p.m,0),0);
    return head('Panel','Resumen de la operación del taller',can('o')?addBtn('nOrd()','Nueva orden'):'')+
    `<div class="stats">${stat('orders','Órdenes activas',db.orders.filter(o=>live(o)&&o.estado!='Entregado').length)}${stat('flag','Listos para entregar',db.orders.filter(o=>o.estado=='Terminado').length)}${can('p')?stat('cash','Cobrado hoy',$(hoy))+stat('wallet','Saldo pendiente',$(db.orders.reduce((s,o)=>s+Math.max(sal(o),0),0))):''}</div>
    <h3>Órdenes recientes</h3>${rec.length?rows(rec):empty('Aún no hay órdenes registradas.','orders',can('o')?addBtn('nOrd()','Crear la primera orden'):'')}`;
  },
  ordenes(){return head('Órdenes','Servicios recibidos, en proceso y entregados',can('o')?addBtn('nOrd()','Nueva orden'):'')+`<div class="bar">${sbox('otbl','Buscar por folio, cliente, placas o estado')}</div><div id="lst">${otbl()}</div>`},

  return `<div class="head"><div><button class="btn sec sm" onclick="go('ordenes')">${ic('back')}Órdenes</button></div><div class="acts">
  <button class="btn sec sm" onclick="openV='${v.id}';openId=null;render()">${ic('clock')}Historial</button>
  ${can('o')&&lv?`<button class="btn sec sm" onclick="waOrd()">${ic('chat')}WhatsApp</button>`:''}
  <button class="btn sec sm" onclick="tk('r')">${ic('print')}Recepción</button>
  ${can('p')?`<button class="btn sm" onclick="tk('p')">${ic('print')}Comprobante de pago</button>`:''}
  ${o.ent?`<button class="btn sec sm" onclick="tk('e')">${ic('print')}Acta de entrega</button>`:''}
  ${can('a')&&lv?`<button class="btn red sm" onclick="cancelO()">${ic('x')}Cancelar orden</button>`:''}</div></div>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap"><h1>${o.folio}</h1>${bd(o.estado)}</div>
  <div class="${can('p')?'grid2':''}"><div class="card"><div class="info">

   <div><small>Falla reportada</small>${esc(o.falla)}</div>
   <div><small>Diagnóstico</small>${esc(o.diag)||'<span class="m">Sin diagnóstico</span>'} ${ed?`<button class="btn sec sm" onclick="diag()">Editar</button>`:''}</div>
   <div><small>Responsable</small>${esc(o.resp)}</div>
   <div><small>Ingreso</small>${fd(o.fecha)}</div>
   ${o.ent?`<div><small>Entrega</small>${esc(o.ent.q)} · ${o.ent.c}<br><span class="m">${fd(o.ent.f)}</span></div>`:''}</div></div>
  ${can('p')?`<div class="card sum"><span class="m">Saldo pendiente</span><div class="big ${sal(o)>0?'neg':'ok'}">${$(sal(o))}</div><div class="pg"><div style="width:${pct}%"></div></div><p><span class="m">Subtotal</span><b class="num">${$(sub(o))}</b></p>${o.disc?`<p><span class="m">Descuento</span><b class="num">-${$(o.disc)}</b></p>`:''}<p><span class="m">Total autorizado</span><b class="num">${$(tot(o))}</b></p><p><span class="m">Pagado</span><b class="num">${$(pd(o))}</b></p>${can('a')&&lv?`<button class="btn sec sm" onclick="descto()">${ic('percent')}Descuento</button>`:''}</div>`:''}</div>
  ${lv?`<div class="card steps">${ES.map((e,i)=>`<button class="st ${i<idx?'done':''} ${i==idx?'cur':''}" onclick="setSt('${e}')"><i>${i<idx?ic('check'):i+1}</i><span>${e}</span></button>`).join('')}</div>`:`<div class="card" style="margin-top:16px"><b class="neg">Orden cancelada</b><br>${esc(o.canc?.r)} <span class="m">· ${esc(o.canc?.u)} · ${o.canc?fd(o.canc.f):''}</span></div>`}
  ${items('jobs','Trabajos y mano de obra')}${items('parts','Piezas')}${fotos}${pays}`;

function delFoto(n){if(!confirm('¿Eliminar esta fotografía?'))return;const o=O(),f=o.fotos.splice(n,1)[0];log('Foto eliminada',`${o.folio}: ${f.e}`);dlg.close();render()}

function setSt(v){
  const o=O();
  if(v==o.estado||!live(o))return;
  if(v=='Entregado'){
    if(!can('o')){alert('Solo recepción o administración pueden registrar la entrega.');return render()}
    const s=sal(o);
    if(s>0){
      if(!can('a')){alert('Entregar con saldo pendiente requiere autorización del administrador.');return render()}
      if(!confirm('La orden tiene saldo pendiente de '+$(s)+'. ¿Autorizar la entrega?'))return render();
    }
    return form('Entrega del vehículo',[{n:'q',l:'Persona que recibe'},{n:'c',l:'Conformidad',o:[['Conforme','Conforme'],['Con observaciones','Con observaciones']]},{n:'n',l:'Observaciones',r:false}],r=>{
      if(s>0)log('Entrega con saldo pendiente',`${o.folio}: saldo ${$(s)}`);
      log('Cambio de estado',`${o.folio}: ${o.estado} → Entregado`);
      o.ent={q:r.q,c:r.c,n:r.n,f:new Date().toISOString(),s};o.estado=v;save();render();
    });
  }
  log('Cambio de estado',`${o.folio}: ${o.estado} → ${v}`);o.estado=v;save();render();
}
function addPay(){
  const o=O(),s=sal(o);
  if(s<=0)return alert('La orden no tiene saldo pendiente.');
  form('Registrar pago',[{n:'m',l:'Importe (saldo '+$(s)+')',t:'number'},{n:'t',l:'Método',o:['Efectivo','Transferencia','Tarjeta'].map(x=>[x,x])},{n:'r',l:'Referencia',r:false}],r=>{
    const m=Math.round(r.m*100)/100;
    if(m<=0||m>s){alert('El importe debe ser mayor a 0 y no superar el saldo pendiente.');return false}
    o.pays.push({f:new Date().toISOString(),m,t:r.t,r:r.r,u:me.user});log('Pago registrado',`${o.folio}: ${$(m)} (${r.t})`);render();
  });
}
function vp(n){if(!confirm('¿Cancelar este pago? El registro se conserva en la bitácora.'))return;const o=O(),p=o.pays[n];p.void=true;log('Pago cancelado',`${o.folio}: ${$(p.m)}`);render()}
function descto(){
  const o=O(),s=sub(o);
  form('Descuento',[{n:'m',l:'Importe del descuento (subtotal '+$(s)+')',t:'number',v:o.disc},{n:'r',l:'Motivo'}],r=>{
    const m=Math.round(r.m*100)/100;
    if(m>s){alert('El descuento no puede superar el subtotal.');return false}
    if(s-m<pd(o)){alert('El descuento dejaría el total por debajo de lo ya pagado.');return false}
    log('Descuento aplicado',`${o.folio}: ${$(o.disc)} → ${$(m)} (${r.r})`);o.disc=m;save();render();
  });
}
function cancelO(){
  const o=O();
  if(o.pays.some(p=>!p.void))return alert('Primero cancela los pagos registrados para poder cancelar la orden.');
  form('Cancelar orden',[{n:'r',l:'Motivo de la cancelación'}],r=>{
    log('Orden cancelada',`${o.folio}: ${o.estado} → Cancelada (${r.r})`);
    o.canc={r:r.r,u:me.user,f:new Date().toISOString()};o.estado='Cancelada';save();render();
  });
}

const wa=(tel,txt)=>{const d=String(tel||'').replace(/\D/g,'');if(d.length<10)return alert('El cliente no tiene un teléfono válido registrado.');window.open(`https://wa.me/${d.length==10?'52'+d:d}?text=${encodeURIComponent(txt)}`,'_blank')};

  let t=`Hola ${c.n}, le escribe ${db.cfg.n}.\nSu vehículo ${v.m} ${v.mo} (placas ${v.pl}), folio ${o.folio}, está en estado: ${o.estado}.`;

function waDeb(cid,s){const c=C(cid);wa(c.t,`Hola ${c.n}, le recordamos que tiene un saldo pendiente de ${$(s)} en ${db.cfg.n}. Quedamos atentos, gracias.`)}

function repo(){
  const t=today(),m=t.slice(0,7),dd=rep.d||t;
  const inR=p=>rep.k=='todo'||(rep.k=='hoy'&&day(p.f)==t)||(rep.k=='mes'&&day(p.f).slice(0,7)==m)||(rep.k=='dia'&&day(p.f)==dd);
  const all=[];db.orders.forEach(o=>o.pays.forEach(p=>{if(inR(p))all.push({o,p})}));
  all.sort((a,b)=>b.p.f.localeCompare(a.p.f));
  const ok=all.filter(x=>!x.p.void),total=ok.reduce((s,x)=>s+x.p.m,0);
  const byM={},byD={};ok.forEach(x=>{byM[x.p.t]=(byM[x.p.t]||0)+x.p.m;const d=day(x.p.f);byD[d]=(byD[d]||0)+x.p.m});
  const days=Object.keys(byD).sort().reverse(),mx=Math.max(...days.map(d=>byD[d]),1);
  const deb={};db.orders.forEach(o=>{if(sal(o)>0){const d=deb[o.cid]=deb[o.cid]||{s:0,n:0,f:o.fecha};d.s+=sal(o);d.n++;if(o.fecha<d.f)d.f=o.fecha}});
  const dl=Object.entries(deb).sort((a,b)=>b[1].s-a[1].s);
  const sel=`<select style="width:auto;margin:0" onchange="rep.k=this.value;render()">${[['hoy','Hoy'],['mes','Este mes'],['dia','Un día específico'],['todo','Todo el historial']].map(x=>`<option value="${x[0]}" ${rep.k==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>${rep.k=='dia'?`<input type="date" style="width:auto;margin:0" value="${dd}" onchange="rep.d=this.value;render()">`:''}`;
  return head('Reportes','Corte de caja, ingresos y clientes con adeudo',sel)+
  `<div class="stats">${stat('cash','Total cobrado',$(total))}${stat('orders','Pagos registrados',ok.length)}${Object.keys(byM).map(k=>stat('wallet',k,$(byM[k]))).join('')}</div>
  <h3>Corte de caja</h3>${all.length?`<div class="tw"><table><tr><th>Fecha</th><th>Folio</th><th>Cliente</th><th>Método</th><th>Importe</th><th>Usuario</th></tr>${all.map(x=>`<tr><td class="num">${fd(x.p.f)}</td><td class="folio">${x.o.folio}</td><td>${esc(C(x.o.cid).n)}</td><td>${x.p.t}</td><td class="num">${x.p.void?`<s>${$(x.p.m)}</s> <span class="neg">Cancelado</span>`:$(x.p.m)}</td><td>${esc(x.p.u)}</td></tr>`).join('')}</table></div>`:empty('No hay pagos en este periodo.','cash')}
  ${days.length>1?`<h3>Ingresos por día</h3><div class="tw"><table><tr><th>Día</th><th>Importe</th><th style="width:50%"></th></tr>${days.map(d=>`<tr><td class="num">${d}</td><td class="num">${$(byD[d])}</td><td><div class="hb" style="width:${byD[d]/mx*100}%"></div></td></tr>`).join('')}</table></div>`:''}
  <h3>Clientes deudores</h3>${dl.length?`<div class="tw"><table><tr><th>Cliente</th><th>Órdenes sin liquidar</th><th>Antigüedad</th><th>Saldo pendiente</th><th></th></tr>${dl.map(([id,d])=>`<tr><td><b>${esc(C(id).n)}</b></td><td>${d.n}</td><td>${Math.floor((Date.now()-new Date(d.f))/864e5)} días</td><td class="num neg">${$(d.s)}</td><td><button class="btn sec sm" onclick="waDeb('${id}',${d.s})">${ic('chat')}Recordar</button></td></tr>`).join('')}</table></div>`:empty('No hay saldos pendientes. Todo está liquidado.','check')}`;
}

function nUser(){
  form('Nuevo usuario',[{n:'u',l:'Usuario (letras y números)'},{n:'p',l:'Contraseña (mínimo 6 caracteres)',t:'password'},{n:'r',l:'Rol',o:[['cajero','Recepcionista / cajero'],['mecanico','Mecánico'],['admin','Administrador']]}],r=>{
    if(!/^[a-z0-9_.-]+$/i.test(r.u)){alert('El usuario solo puede tener letras, números, punto, guion y guion bajo.');return false}
    if(db.users.some(x=>x.user.toLowerCase()==r.u.toLowerCase())){alert('Ese usuario ya existe.');return false}
    if(r.p.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return false}
    db.users.push({user:r.u,pw:r.p,rol:r.r});log('Usuario creado',`${r.u} (${r.r})`);render();
  });
}
function cpw(u){
  const x=db.users.find(a=>a.user==u);if(!x)return;
  form('Nueva contraseña de '+esc(u),[{n:'p',l:'Contraseña (mínimo 6 caracteres)',t:'password'}],r=>{
    if(r.p.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return false}
    x.pw=r.p;log('Contraseña cambiada',u);render();
  });
}
function togU(u){const x=db.users.find(a=>a.user==u);if(!x)return;x.on=x.on===false;log(x.on===false?'Usuario desactivado':'Usuario activado',u);render()}
function editCfg(){
  const c=db.cfg;
  form('Datos del taller',[{n:'n',l:'Nombre del taller',v:c.n},{n:'a',l:'Dirección',r:false,v:c.a},{n:'t',l:'Teléfono',r:false,v:c.t},{n:'f',l:'Mensaje al pie del ticket',r:false,v:c.f},{n:'l',l:'Logotipo (opcional)',t:'file',r:false}],r=>{
    Object.assign(c,{n:r.n,a:r.a,t:r.t,f:r.f});
    const fin=()=>{log('Configuración actualizada','');document.title=c.n;render()};
    if(r.l&&r.l.size)img(r.l,240,'image/png').then(s=>{c.l=s;fin()}).catch(()=>{alert('No se pudo leer el logotipo.');fin()});else fin();
  });
}

function tk(mode,n){
  const o=O(),c=C(o.cid),v=Vh(o.vid),cf=db.cfg;
  const rows=a=>a.filter(i=>i.aut).map(i=>`<tr><td>${esc(i.d)}</td><td>${i.q}</td><td>${$(i.q*i.p)}</td></tr>`).join('')||'<tr><td colspan="3">—</td></tr>';
  const T={r:'Comprobante de recepción',p:'Comprobante de pago',e:'Acta de entrega del vehículo'}[mode];
  let h=`<div style="display:flex;gap:12px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px">${cf.l?`<img src="${cf.l}" style="max-height:60px" alt="">`:''}<div><div style="font-size:22px;font-weight:700">${esc(cf.n)}</div><small>${esc(cf.a)}${cf.t?' · Tel. '+esc(cf.t):''}</small></div></div><p><b>${T}</b><br>Folio ${o.folio} · ${new Date().toLocaleDateString('es-MX')}</p><p>Cliente: ${esc(c.n)}${can('c')?' · '+esc(c.t):''}<br>Vehículo: ${esc(v.m)} ${esc(v.mo)} ${esc(v.a)} · Placas ${esc(v.pl)}<br>Falla reportada: ${esc(o.falla)}</p>`;
  if(mode=='p'){
    const ok=o.pays.filter(p=>!p.void),cur=n!=null?o.pays[n]:ok[ok.length-1];
    h+=`<b>Trabajos y mano de obra</b><table><tr><th>Concepto</th><th>Cant.</th><th>Importe</th></tr>${rows(o.jobs)}</table><br><b>Piezas</b><table><tr><th>Concepto</th><th>Cant.</th><th>Importe</th></tr>${rows(o.parts)}</table><p>Subtotal: ${$(sub(o))}<br>${o.disc?`Descuento: -${$(o.disc)}<br>`:''}Total: <b>${$(tot(o))}</b><br>Pago actual: <b>${cur?$(cur.m)+' ('+cur.t+')':'—'}</b><br>Pagos acumulados: <b>${$(pd(o))}</b><br>Saldo restante: <b>${$(sal(o))}</b></p>`;
  }
  if(mode=='e'&&o.ent){
    h+=`<p>Entregado a: <b>${esc(o.ent.q)}</b><br>Fecha: ${fd(o.ent.f)}<br>Conformidad: <b>${o.ent.c}</b>${o.ent.n?'<br>Observaciones: '+esc(o.ent.n):''}<br>Saldo pendiente al entregar: <b>${$(o.ent.s)}</b></p><div style="display:flex;gap:40px;margin-top:60px"><div style="flex:1;border-top:1px solid #000;text-align:center;padding-top:4px">Firma de quien recibe</div><div style="flex:1;border-top:1px solid #000;text-align:center;padding-top:4px">Por el taller</div></div>`;
  }
  h+=`<p style="margin-top:18px;text-align:center">${esc(cf.f)}</p>`;
  document.getElementById('tk').innerHTML=h;window.print();
}

function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='respaldo-taller.json';a.click()}
function rs(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{
    const d=JSON.parse(t);if(!d.orders||!d.users)throw 0;
    if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return;
    db=d;norm();me=db.users.find(u=>u.user==me.user&&u.on!==false)||null;
    if(me)log('Respaldo restaurado','');save();openId=null;openV=null;render();
  }catch(x){alert('El archivo no es un respaldo válido.')}});
}

render();
</script>
